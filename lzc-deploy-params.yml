        custom_domain:
            name: "自定义域名"
            description: "应用程序的自定义域名（不带 https:// 或 http://）。该域名需公网可达以申请内置 Let's Encrypt 证书。"

        vapid_public_key:
            name: "VAPID 公钥"
            description: "用于 Web Push 推送的 P-256 公钥（URL-safe Base64）。留空则关闭推送通知。"

        vapid_private_key:
            name: "VAPID 私钥"
            description: "与公钥配对的 P-256 私钥（URL-safe Base64）。"

    en:
