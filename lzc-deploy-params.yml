params:
    - id: enable_custom_domain
      type: bool
      name: "Enable Custom Domain"
      description: "Whether the app is reached through a custom domain (TLS terminated by an external reverse proxy or CDN). If false, the LazyCat-provided domain is used."
      default_value: false

    - id: custom_domain
      type: string
      name: "Custom Domain"
      description: "Custom domain, without https:// or http://. Point the domain at this app and terminate TLS externally (e.g. Cloudflare or your own reverse proxy)."
      default_value: ""
      optional: true

    - id: vapid_public_key
      type: string
      name: "VAPID Public Key"
      description: "P-256 public key in URL-safe Base64 for Web Push notifications. Leave empty to keep push disabled."
      default_value: "BPpI5uuvCWArmATkvt4ylQMPJpBnrFRspnUC3oM0oEdAKHuFpqs_vyRNJfjNGHr68rbXBjXZ_gzl9WgXcapeiDw"

    - id: vapid_private_key
      type: string
      name: "VAPID Private Key"
      description: "P-256 private key in URL-safe Base64, the pair of the public key above."
      default_value: "2T2wM8Q-kmnJsdi67um7nFBhGGsGMWRD1KmLvOqd9lw="

locales:
    zh:
        enable_custom_domain:
            name: "启用自定义域名"
            description: "是否通过自定义域名访问（TLS 由外部反向代理/CDN 终止）；关闭时使用懒猫微服域名。"

        custom_domain:
            name: "自定义域名"
            description: "应用程序的自定义域名（不带 https:// 或 http://）。请自行将域名指向本应用并在外部终止 TLS（如 Cloudflare 或自有反代）。"

        vapid_public_key:
            name: "VAPID 公钥"
            description: "用于 Web Push 推送的 P-256 公钥（URL-safe Base64）。留空则关闭推送通知。"

        vapid_private_key:
            name: "VAPID 私钥"
            description: "与公钥配对的 P-256 私钥（URL-safe Base64）。"

    en:
        enable_custom_domain:
            name: "Enable Custom Domain"
