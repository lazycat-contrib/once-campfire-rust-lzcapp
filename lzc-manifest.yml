application:
  subdomain: campfire-rust
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://once-campfire-rust:80/
services:
  once-campfire-rust:
    # upstream: ghcr.io/basecamp/once-campfire-rust:v0.1.2
    image: ghcr.1ms.run/basecamp/once-campfire-rust:v0.1.2
    # 镜像内以 uid 1000 运行，持久目录由 root 挂载；以 root 启动保证存储可写
    user: root
    environment:
{{if .U.custom_domain}}
      # 自定义域名：TLS 由外部反向代理/CDN（如 Cloudflare）终止，容器内走明文 HTTP
      - VAPID_SUBJECT=https://{{.U.custom_domain}}
{{else}}
      # 默认：懒猫微服网关负责 TLS 终止，应用走明文 HTTP（见上游 README 的 Plain HTTP）
      - VAPID_SUBJECT=https://{{.S.AppDomain}}
{{end}}
      - DISABLE_SSL=1
      - SECRET_KEY_BASE={{stable_secret "campfire-rust#secret_key"}}
      - VAPID_PUBLIC_KEY={{.U.vapid_public_key}}
      - VAPID_PRIVATE_KEY={{.U.vapid_private_key}}
    binds:
      - /lzcapp/var/storage:/rails/storage
